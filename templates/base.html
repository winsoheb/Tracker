<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Time Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
</head>
<body>
  <nav class="nav">
    <span class="brand"><span class="dot"></span>Time Tracker</span>
    <a class="tab {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">Dashboard</a>
    <a class="tab {% if request.path.startswith('/entries') %}active{% endif %}" href="{{ url_for('entries_page') }}">Log</a>
    <a class="tab {% if request.path == '/insights' %}active{% endif %}" href="{{ url_for('insights_page') }}">Insights</a>
    <a class="tab {% if request.path == '/reports' %}active{% endif %}" href="{{ url_for('reports_page') }}">Reports</a>
    <a class="tab {% if request.path == '/settings' %}active{% endif %}" href="{{ url_for('settings_page') }}">Settings</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
