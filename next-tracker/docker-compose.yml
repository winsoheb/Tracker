version: '3.8'

services:
  web:
    build: .
    container_name: next-tracker
    restart: always
    expose:
      - "3000"
    depends_on:
      - db
    env_file:
      - .env

  nginx:
    build: ./nginx
    container_name: next-tracker-nginx
    restart: always
    ports:
      - "8443:443"
    depends_on:
      - web

  db:
    image: postgres:15-alpine
    container_name: next-tracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: timetracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
